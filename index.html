<style>
:root {
  --primary:#f97316; --primary-light:#fff7ed; --green:#22c55e; --green-light:#f0fdf4;
  --border:#e5e7eb; --text:#333; --text-secondary:#666; --bg:#f5f5f7;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
button,input,select { font:inherit; }
.app { display:flex; flex-direction:column; height:100vh; }

/* 顶部 */
header { height:52px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; flex-shrink:0; }
header .logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; color:var(--primary); }
header .logo-icon { width:28px; height:28px; background:linear-gradient(135deg,#f97316,#fb923c); border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
header .nav { display:flex; gap:20px; color:var(--text-secondary); font-size:14px; }
header .nav a { text-decoration:none; color:inherit; }
header .nav a:hover { color:var(--primary); }
header .right { display:flex; align-items:center; gap:12px; }
header .btn { padding:5px 12px; border-radius:14px; font-size:12px; cursor:pointer; }
header .btn.orange { background:#fff7ed; color:#f97316; border:1px solid #fed7aa; }
header .btn.green { background:#22c55e; color:#fff; border:none; }

/* 主区域 */
main { flex:1; display:flex; overflow:hidden; }

/* 左侧面板 */
.left-panel { width:240px; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.type-tabs { display:flex; gap:4px; padding:10px; border-bottom:1px solid var(--border); overflow-x:auto; }
.type-tabs::-webkit-scrollbar { display:none; }
.type-tabs .tab { padding:6px 12px; border-radius:6px; cursor:pointer; white-space:nowrap; color:var(--text-secondary); font-size:13px; }
.type-tabs .tab:hover { background:#f9fafb; }
.type-tabs .tab.on { background:var(--primary-light); color:var(--primary); font-weight:600; }
.tpl-grid { flex:1; overflow-y:auto; display:flex; flex-wrap:wrap; gap:10px; padding:10px; align-content:flex-start; }
.tpl-item { width:calc(50% - 5px); border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent; position:relative; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.06); transition:box-shadow .15s, border-color .15s; display:flex; flex-direction:column; }
.tpl-item:hover { border-color:#fdba74; box-shadow:0 4px 12px rgba(0,0,0,.10); }
.tpl-item.on { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
.tpl-item img { width:100%; height:auto; display:block; background:#f0f0f0; flex:0 0 auto; }
.tpl-item .name { padding:6px 4px 7px; font-size:12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#333; line-height:1.35; border-top:1px solid #f0f0f0; flex:0 0 auto; }
.tpl-item .tag { position:absolute; top:6px; right:6px; background:var(--green); color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; }
.tpl-item .vip { position:absolute; top:6px; left:6px; background:#f59e0b; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; }

/* 中间画布 */
.center { flex:1; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:auto; position:relative; padding:10px; }
.canvas-wrap { position:relative; display:flex; justify-content:center; align-items:center; overflow:hidden; box-shadow:0 12px 50px rgba(0,0,0,.12); background:#fff; }
.canvas { position:relative; overflow:hidden; background:#fff; flex-shrink:0; }
.canvas .bg { position:absolute; inset:0; background-size:cover; background-position:center; }
.canvas .bg-blur { position:absolute; inset:0; }
.canvas .devices { position:absolute; inset:0; }

/* 右侧面板 */
.right-panel { width:320px; background:#fff; border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.right-tabs { display:flex; border-bottom:1px solid var(--border); }
.right-tabs .tab { flex:1; text-align:center; padding:12px; cursor:pointer; color:var(--text-secondary); font-size:14px; }
.right-tabs .tab.on { color:var(--primary); border-bottom:2px solid var(--primary); font-weight:600; }
.tab-content { flex:1; overflow-y:auto; padding:14px; }
.sub-tabs { display:flex; gap:6px; margin-bottom:14px; }
.sub-tabs .chip { flex:1; text-align:center; padding:6px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; }
.sub-tabs .chip.on { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.row { margin-bottom:14px; }
.row .lbl { font-size:13px; color:var(--text-secondary); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.row input[type=text], .row input[type=number], .row input[type=color] { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; }
.row .inputs { display:flex; gap:8px; }
.row .inputs input { flex:1; }
.row .btns { display:flex; gap:6px; flex-wrap:wrap; }
.row .btn { padding:6px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; background:#fff; color:#444; }
.row .btn.on { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.row .hint { font-size:12px; color:#999; padding:10px; background:#f9fafb; border-radius:6px; }
.size-presets { display:flex; flex-direction:column; gap:6px; }
.size-presets .preset { padding:8px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; color:#444; }
.size-presets .preset.on { border-color:var(--green); background:var(--green-light); }
.upload-box { border:1px dashed #d1d5db; border-radius:8px; padding:22px; text-align:center; color:#999; cursor:pointer; }
.upload-box:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.wp-thumb-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.wp-thumb { width:56px; height:56px; border-radius:8px; background-size:cover; background-position:center; position:relative; border:1px solid var(--border); overflow:hidden; }
.wp-thumb .wp-del { position:absolute; top:2px; right:2px; width:16px; height:16px; background:rgba(0,0,0,.5); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; line-height:1; }
.wp-thumb-add { width:56px; height:56px; padding:0; display:flex; align-items:center; justify-content:center; font-size:24px; border-radius:8px; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; }
.switch { width:40px; height:22px; background:#d1d5db; border-radius:11px; position:relative; cursor:pointer; transition:.2s; }
.switch.on { background:var(--green); }
.switch::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s; }
.switch.on::after { left:20px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.footer-actions { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
.footer-actions button { flex:1; padding:10px; border:none; border-radius:6px; cursor:pointer; color:#fff; font-size:13px; }
.footer-actions .btn-green { background:var(--green); }
.footer-actions .btn-primary { background:var(--primary); }
.footer-actions .btn-blue { background:#3b82f6; }

/* 画布内设备 */
.device { position:absolute; left:50%; top:50%; transform-origin:center center; }
.device .screen { position:absolute; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.device .screen img.wallpaper { width:100%; height:100%; object-fit:cover; }
.device .screen div.wallpaper { position:absolute; left:0; top:0; width:100%; height:100%; background-size:cover; background-position:center; background-repeat:no-repeat; }
.device .border { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; background-repeat:no-repeat; background-position:center; background-size:contain; z-index:5; }

/* 锁屏组件 */
.status-bar { position:absolute; top:0; left:0; width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 18px; font-size:12px; z-index:20; color:#fff; }
.status-bar .left { display:flex; gap:4px; align-items:center; }
.status-bar .right { display:flex; gap:6px; align-items:center; }
.signal { display:flex; gap:1px; align-items:flex-end; height:10px; }
.signal span { width:3px; background:currentColor; border-radius:1px; }
.battery { width:22px; height:11px; border:1px solid currentColor; border-radius:2px; position:relative; }
.battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:4px; background:currentColor; border-radius:0 1px 1px 0; }
.battery .fill { height:100%; background:currentColor; }
.wifi { width:14px; height:10px; }
.wifi svg { display:block; }
.dynamic-island { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:94px; height:28px; background:#000; border-radius:14px; z-index:30; }
.date-time { position:absolute; z-index:20; display:flex; flex-direction:column; align-items:center; color:#fff; text-align:center; line-height:1.1; }
.date-time .time { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-weight:300; letter-spacing:-1px; }
.date-time .date { font-size:15px; margin-top:6px; opacity:.9; }
.time-style-0 { font-size:64px; }
.time-style-1 { font-size:64px; font-weight:700; letter-spacing:2px; }
.time-style-2 { font-size:64px; font-family:SFMono-Regular,Menlo,monospace !important; font-weight:500; }
.time-style-3 { font-size:48px; font-weight:200; }
.bottom-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:120px; height:5px; background:#fff; border-radius:3px; z-index:20; }

/* 专注模式药丸小组件（iOS 26 Liquid Glass 风格） */
.focus-pill-widget { position:absolute; top:230px; left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:340px; height:60px; z-index:25; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.focus-pill-widget .pill { width:100%; height:100%; border-radius:32px; background:rgba(255,255,255,0.45); border:1px solid rgba(255,255,255,0.5); box-shadow:0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:space-between; padding:0 16px; box-sizing:border-box; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.focus-pill-widget .pill-icon { width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.22); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,0.2); }
.focus-pill-widget .pill-text { font-size:15px; font-weight:500; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; text-shadow:0 1px 3px rgba(0,0,0,0.4); letter-spacing:1px; }
.focus-pill-widget .icon-silence { width:12px; height:16px; border:2px solid #fff; border-radius:2px; position:relative; }
.focus-pill-widget .icon-silence::before { content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:6px; height:2px; background:#fff; border-radius:1px; }
.focus-pill-widget .icon-camera { width:16px; height:12px; border:2px solid #fff; border-radius:2px; position:relative; }
.focus-pill-widget .icon-camera::before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:5px; height:5px; border:2px solid #fff; border-radius:50%; }
.focus-pill-widget .icon-camera::after { content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:5px; height:2px; background:#fff; border-radius:1px; }

/* 菜单组件 */
.icon-grid { position:absolute; inset:0; display:grid; grid-template-columns:repeat(4,1fr); gap:12px 8px; padding:60px 18px 90px; align-content:start; z-index:15; }
.app-icon { display:flex; flex-direction:column; align-items:center; gap:4px; }
.app-icon .icon { width:54px; height:54px; border-radius:14px; background:linear-gradient(135deg,#4f46e5,#ec4899); display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.app-icon .label { font-size:10px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
.dock { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:12px; padding:10px 14px; background:rgba(255,255,255,.25); border-radius:26px; backdrop-filter:blur(10px); z-index:16; }
.dock .icon { width:54px; height:54px; border-radius:14px; background:linear-gradient(135deg,#3b82f6,#06b6d4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; }

/* 辅助 */
.loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#999; font-size:12px; }
.hidden { display:none !important; }

/* Toast 提示 */
#toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:9999; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center; }
#toast.show { opacity:1; }

/* 导出图片预览浮层（主屏幕 App 模式下长按保存） */
#saveOverlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9998; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
#saveOverlay img { max-width:92%; max-height:70vh; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.5); }
#saveOverlay .tip { color:#fff; font-size:14px; margin-top:14px; text-align:center; line-height:1.7; }
#saveOverlay .close, #saveOverlay .share-btn { margin-top:16px; padding:12px 32px; border:none; border-radius:10px; font-size:15px; cursor:pointer; }
#saveOverlay .share-btn { background:var(--primary); color:#fff; }
#saveOverlay .close { background:#555; color:#fff; }

/* 批量导出结果面板：一次性展示所有导出图，可逐张保存/下载，支持重新选择 */
#batchPanel { position:fixed; inset:0; background:rgba(20,20,28,.94); z-index:9999; display:flex; flex-direction:column; }
#batchPanel .bp-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; color:#fff; border-bottom:1px solid rgba(255,255,255,.12); flex-shrink:0; }
#batchPanel .bp-head h3 { margin:0; font-size:16px; font-weight:600; }
#batchPanel .bp-head .bp-count { font-size:13px; color:#b9b9c4; margin-left:8px; }
#batchPanel .bp-actions { display:flex; gap:8px; align-items:center; }
#batchPanel .bp-actions button { padding:8px 14px; border:none; border-radius:9px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
#batchPanel .bp-close { background:#4a4a55; color:#fff; }
#batchPanel .bp-reselect { background:rgba(255,255,255,.15); color:#fff; }
#batchPanel .bp-download-all { background:var(--primary); color:#fff; }
#batchPanel .bp-body { flex:1; overflow-y:auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; align-content:start; }
@media (max-width:480px){ #batchPanel .bp-body { grid-template-columns:repeat(2,1fr); padding:12px; gap:10px; } }
#batchPanel .bp-item { background:rgba(255,255,255,.07); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
#batchPanel .bp-item img { width:100%; display:block; background:#000; }
#batchPanel .bp-item .bp-cap { display:flex; align-items:center; justify-content:space-between; padding:9px 10px; }
#batchPanel .bp-item .bp-cap span { color:#cfcfd6; font-size:12px; }
#batchPanel .bp-item .bp-save { background:var(--primary); color:#fff; border:none; padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
#batchPanel .bp-item .bp-save:active { opacity:.8; }

/* ========== 画布结果画廊：批量导出后结果直接显示在画布上，可滑动查看 ========== */
#galleryView { position:absolute; inset:0; z-index:700; background:#fff; display:none; align-items:center; justify-content:center; overflow:hidden; }
#galleryView.show { display:flex; }
#galleryView #galleryImg { max-width:100%; max-height:100%; object-fit:contain; user-select:none; -webkit-user-select:none; }
#galleryBar { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:801; display:none; align-items:center; gap:8px; background:rgba(255,255,255,.95); box-shadow:0 6px 24px rgba(0,0,0,.16); border-radius:14px; padding:6px 10px; max-width:calc(100% - 20px); flex-wrap:wrap; justify-content:center; }
#galleryBar.show { display:flex; }
#galleryBar .gb-nav { display:flex; align-items:center; gap:6px; }
#galleryBar .gb-arrow { width:34px; height:34px; border:none; border-radius:9px; background:#f1f2f5; color:#333; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
#galleryBar .gb-arrow:active { background:#e2e4ea; }
#galleryBar .gb-arrow:disabled { opacity:.35; }
#galleryBar .gb-count { min-width:64px; text-align:center; font-size:13px; color:#555; font-weight:600; }
#galleryBar .gb-sep { width:1px; height:22px; background:#e3e4ea; }
#galleryBar .gb-action { border:none; border-radius:9px; padding:8px 14px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
#galleryBar .gb-save { background:var(--primary); color:#fff; font-weight:600; min-width:96px; }
#galleryBar .gb-save:active { opacity:.85; }
#galleryBar .gb-reselect { background:#fff; color:var(--primary); border:1px solid var(--primary); }
#galleryBar .gb-exit { background:#f1f2f5; color:#555; }
#galleryStrip { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:800; display:none; align-items:center; gap:8px; background:rgba(255,255,255,.92); box-shadow:0 6px 24px rgba(0,0,0,.16); border-radius:12px; padding:7px 10px; max-width:94%; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
#galleryStrip::-webkit-scrollbar { display:none; }
#galleryStrip.show { display:flex; }
#galleryStrip .gs-thumb { flex-shrink:0; width:52px; height:52px; border-radius:8px; overflow:hidden; border:2px solid transparent; cursor:pointer; -webkit-tap-highlight-color:transparent; position:relative; }
#galleryStrip .gs-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
#galleryStrip .gs-thumb.on { border-color:var(--primary); }
#galleryStrip .gs-thumb .gs-idx { position:absolute; left:2px; top:2px; font-size:10px; color:#fff; background:rgba(0,0,0,.55); border-radius:4px; padding:0 4px; line-height:14px; }

/* 手机端画廊工具条改为可换行，更易点按 */
@media (max-width:860px){
  #galleryBar { top:6px; padding:5px 6px; gap:5px; flex-wrap:wrap; max-width:calc(100% - 12px); justify-content:center; }
  #galleryBar .gb-nav { gap:4px; }
  #galleryBar .gb-arrow { width:32px; height:32px; font-size:16px; }
  #galleryBar .gb-count { min-width:48px; font-size:12px; }
  #galleryBar .gb-sep { display:none; }
  #galleryBar .gb-save { min-width:80px; padding:7px 10px; font-size:12px; }
  #galleryBar .gb-reselect { padding:7px 10px; font-size:12px; }
  #galleryBar .gb-exit { padding:7px 10px; font-size:12px; }
  #galleryStrip { bottom:6px; gap:6px; padding:5px 7px; max-width:calc(100% - 12px); }
  #galleryStrip .gs-thumb { width:52px; height:52px; }
}

/* 移动端侧拉抽屉（默认隐藏，仅手机端显示菜单按钮） */
.header-left { display:flex; align-items:center; gap:8px; }
.menu-btn { display:none; width:36px; height:36px; margin-left:-6px; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.menu-btn:active { background:#f3f4f6; }
.drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
.drawer-mask.show { opacity:1; pointer-events:auto; }
.drawer-head { display:none; }
body.drawer-open { overflow:hidden; }

/* 移动端适配：左侧模板列表 → 侧拉抽屉；画布在上、设置面板在下；桌面端保持三栏不变 */
@media (max-width: 860px) {
  .app { height:auto; min-height:100vh; }
  header { position:sticky; top:0; z-index:900; padding:0 12px; padding-top:env(safe-area-inset-top); box-shadow:0 1px 6px rgba(0,0,0,.05); }
  header .nav, header .right { display:none; }
  .menu-btn { display:flex; }

  main { flex-direction:column; overflow:visible; }

  /* 画布固定在页面顶部 */
  .center { order:1; height:50vh; min-height:50vh; max-height:52vh; padding:10px 0; }

  /* 设置面板在画布下方，跟随页面滚动 */
  .right-panel { order:2; width:100%; border-left:none; border-top:1px solid var(--border); }

  /* 左侧模板列表 → 左侧滑出抽屉 */
  .left-panel { position:fixed; left:0; top:0; bottom:0; width:min(82vw, 330px); z-index:1000; border-right:1px solid var(--border); border-top:none; transform:translateX(-105%); transition:transform .28s ease; box-shadow:none; }
  .left-panel.open { transform:translateX(0); box-shadow:8px 0 30px rgba(0,0,0,.18); }
  .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; flex-shrink:0; }
  .drawer-head .close-drawer { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#f3f4f6; cursor:pointer; color:#666; -webkit-tap-highlight-color:transparent; }
  .left-panel .tpl-grid { padding-bottom:calc(12px + env(safe-area-inset-bottom)); }

  .tpl-item { width:calc(50% - 5px); }
  .tab-content { overflow:visible; }
  .footer-actions { position:sticky; bottom:0; z-index:10; background:#fff; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -4px 12px rgba(0,0,0,.06); }
}

  bgW: 1200, bgH: 1600,
  bgMode: 'tpl', // tpl | color | image | gradient

  wallpapers: [],

  textOverlays: [],

};

const RIGHT_TABS = [{k:'bg',n:'背景'},{k:'phone',n:'手机'},{k:'icon',n:'图标'},{k:'text',n:'文字'},{k:'data',n:'数据'}];
const PHONE_SUBS = [{k:'lock',n:'锁屏'},{k:'menu',n:'菜单'},{k:'frame',n:'仅样机'}];

  {name:'适用于小红书', w:1200, h:1600, ratio:'3:4'},

];

// ============== 工具 ==============
const $ = id => document.getElementById(id);
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d = new Date(); return {m:d.getMonth()+1, day:d.getDate(), wd:['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}; }
function syncTimeDate(){ const t = today(); S.dateText = S.dateLang==='zh'? t.m+'月'+t.day+'日' : 'May '+t.day; S.weekdayText = t.wd; S.timeText = pad(new Date().getHours())+':'+pad(new Date().getMinutes()); }

// ============== 模板加载 ==============
function curTpl(){ return TPL_DATA[S.typeIdx].templates[S.tplIdx]; }
function loadTemplate(typeIdx, tplIdx){
  S.typeIdx = typeIdx; S.tplIdx = tplIdx;
  const tpl = curTpl();
  S.bgW = tpl.bg.w; S.bgH = tpl.bg.h;
  S.bgMode = 'tpl';
  S.bgImage = null; S.wallpapers = [];
  S.deviceOverrides = tpl.devices.map(() => ({}));
  // 如果模板自带背景模糊，把滑块初始化为模板默认值，拖动时才能看到变化
  if (tpl.bg.type === 'IMAGE' && tpl.bg.openBlur && tpl.bg.blur) {
    S.bgBlur = tpl.bg.blur;
  } else {
    S.bgBlur = 0;
  }
  syncTimeDate();
  renderTemplateGrid(); renderCanvas(); updateRightPanel();
}

// ============== 左侧模板库 ==============
function renderTemplateGrid(){
  const tabs = $('typeTabs'); tabs.innerHTML = '';
  TPL_DATA.forEach((t,i)=>{
    const el = document.createElement('div'); el.className = 'tab'+(i===S.typeIdx?' on':''); el.textContent = t.name; el.onclick = () => { S.typeIdx=i; S.tplIdx=0; loadTemplate(i,0); }; tabs.appendChild(el);
  });
  const grid = $('tplGrid'); grid.innerHTML = '';
  TPL_DATA[S.typeIdx].templates.forEach((t,i)=>{
    const el = document.createElement('div'); el.className = 'tpl-item'+(i===S.tplIdx?' on':'');
    el.innerHTML = `<img src="${t.preview}" loading="lazy" alt="${t.name}"><div class="name">${t.name}</div>${t.vip?'<span class="vip">VIP</span>':''}${t.tag?'<span class="tag">'+t.tag+'</span>':''}`;
    el.onclick = () => { loadTemplate(S.typeIdx, i); if (typeof closeDrawer === 'function') closeDrawer(); };
    grid.appendChild(el);
  });
}

// ============== 画布渲染 ==============
// 背景模糊：把背景图用 Canvas 2D 烘焙成模糊图（dataURL），
// 这样浏览器预览和 html2canvas 导出都能显示模糊（html2canvas 不支持 CSS backdrop-filter/filter）。
function applyBgBlur(bgEl, imageUrl, blurPx){
  if (!imageUrl || !bgEl || !blurPx) return;
  // 用画布原始像素尺寸烘焙模糊图，保证导出高分辨率时模糊清晰
  const w = S.bgW || bgEl.clientWidth, h = S.bgH || bgEl.clientHeight;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      // 用稍大尺寸绘制并居中放大，避免模糊后边缘出现透明边
      const pad = blurPx * 2 + 20;
      const c = document.createElement('canvas');
      c.width = w + pad * 2; c.height = h + pad * 2;
      const ctx = c.getContext('2d');
      const scale = Math.max((w + pad * 2) / img.width, (h + pad * 2) / img.height);
      ctx.filter = `blur(${blurPx}px)`;
      ctx.drawImage(img, (c.width - img.width * scale) / 2, (c.height - img.height * scale) / 2, img.width * scale, img.height * scale);
      ctx.filter = 'none';
      bgEl.style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.9)})`;
    } catch(e){ console.warn('背景模糊失败', e); }
  };
  img.onerror = () => {};
  img.src = imageUrl;
}
function renderCanvas(){
  const canvas = $('canvas'); const wrap = $('canvasWrap');
  const tpl = curTpl();
  // 画布尺寸保持原始像素
  canvas.style.width = S.bgW+'px'; canvas.style.height = S.bgH+'px';
  canvas.style.transform = 'none';
  // 缩放适配
  fitCanvas();
  canvas.innerHTML = '';
  // 画布尺寸与模板原始尺寸不同时（如切到公众号封面等预设）：
  // 背景保持 cover 铺满整个画布（横版海报感，物品不缩小、自然分散）；
  // 设备层等比缩放并整体居中，完整显示且不被挤到角落
  const dScale = Math.min(S.bgW / tpl.bg.w, S.bgH / tpl.bg.h, 1);
  // 背景
  const bg = document.createElement('div'); bg.className = 'bg';
  if (S.bgMode === 'tpl') {
    if (tpl.bg.image) bg.style.backgroundImage = `url(${tpl.bg.image})`;
    if (tpl.bg.background && tpl.bg.type === 'COLOR') bg.style.background = tpl.bg.background;
    if (tpl.bg.gradient) bg.style.background = tpl.bg.gradient;
    if (tpl.bg.imgStyle) bg.style.cssText += ';' + tpl.bg.imgStyle;
    // 模板自带背景模糊：用 Canvas 2D 烘焙（预览+导出都生效）
    if (tpl.bg.openBlur && tpl.bg.blur && tpl.bg.image) { bg.dataset.blur = tpl.bg.blur; applyBgBlur(bg, tpl.bg.image, tpl.bg.blur); }
  } else if (S.bgMode === 'image' && S.bgImage) {
    bg.style.backgroundImage = `url(${S.bgImage})`;
    // 上传图片时完整显示，不裁切
    bg.style.backgroundSize = 'contain';
  } else if (S.bgMode === 'color') {
    bg.style.background = S.bgColor;
  } else if (S.bgMode === 'gradient') {
    bg.style.background = S.bgGradient;
  }
  canvas.appendChild(bg);
  // 背景模糊滑块（S.bgBlur>0 时优先于模板自带 blur，对图片背景生效）
  if (S.bgBlur > 0) {
    const bgUrl = S.bgMode === 'tpl' ? (tpl.bg.image || '') : (S.bgMode === 'image' ? (S.bgImage || '') : '');
    if (bgUrl) applyBgBlur(bg, bgUrl, S.bgBlur);
    // 纯色/渐变背景无图像内容可模糊，无需处理
  } else if (bg.dataset.blur && (S.bgMode === 'tpl')) {
    // S.bgBlur 为 0 时，保留模板自带 blur
    if (tpl.bg.openBlur && tpl.bg.blur) { /* 已在第393行通过 dataset 处理 */ }
  }
  // 设备层
  const devices = document.createElement('div'); devices.className = 'devices'; canvas.appendChild(devices);
  tpl.devices.forEach((dev, idx) => renderDevice(devices, dev, idx));
  if (dScale < 1) fitDevicesToCanvas(devices, dScale);
  // 文字叠加层
  S.textOverlays.forEach(t => {
    const el = document.createElement('div'); el.className = 'text-overlay';
    el.textContent = t.text;
    el.style.cssText = `position:absolute;left:${t.x}%;top:${t.y}%;transform:translate(-50%,-50%);font-size:${t.fontSize}px;color:${t.color};font-weight:${t.fontWeight};font-family:${t.fontFamily};white-space:nowrap;z-index:100;text-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none;`;
    if (S.selectedTextId === t.id) el.style.outline = '2px dashed var(--primary)';
    canvas.appendChild(el);
  });
  // 版权/水印
  if (S.showCopyright || S.showWatermark) {
    const mark = document.createElement('div'); mark.className = 'canvas-mark';
    mark.style.cssText = 'position:absolute;bottom:12px;right:14px;font-size:12px;color:rgba(255,255,255,.55);z-index:200;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none;';
    mark.textContent = S.showCopyright ? '© 图片由壁纸样机生成器生成' : '壁纸样机生成器';
    canvas.appendChild(mark);
  }
  scheduleSave(); // 任何渲染变化后自动保存历史数据
}

function fitCanvas(){
  const wrap = $('canvasWrap'), canvas = $('canvas');
  const parent = wrap.parentElement;
  // 与原站保持一致：预览窗口占满整个可用空间，内部画布保持原始尺寸并居中裁剪显示
  // 这样设备在预览区中更大、更聚焦，且不被固定比例限制
  const w = parent.clientWidth - 20;
  const h = parent.clientHeight - 20;
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  // 画布按预览区等比缩放，完整显示在 wrap 内（不再被 overflow:hidden 上下裁剪）
  const k = Math.min(w / S.bgW, h / S.bgH);
  canvas.style.transform = `scale(${k})`;
  canvas.style.width = S.bgW + 'px';
  canvas.style.height = S.bgH + 'px';
}

// 画布小于模板时：设备层等比缩放 dScale，并把设备整体包围盒居中到画布中心，
// 避免设备被挤到角落或超出画布。
// 当 dScale 太小（<0.6，如竖版模板塞到 1200x510 横版画布）会导致设备缩到看不见，
// 此时改为保持设备原样大小、整体居中，背景图 cover 铺满剩余空间（公众号封面"手机+标题"排版）
function fitDevicesToCanvas(devices, dScale){
  // 父画布可能带 fitCanvas 的预览缩放 scale(k)，测量值是视觉坐标，需换算回设备层布局坐标
  const cs = getComputedStyle($('canvas')).transform;
  const k = (cs && cs.indexOf('matrix') === 0) ? parseFloat(cs.split('(')[1].split(',')[0]) : 1;
  const inv = (k && isFinite(k)) ? k : 1;
  devices.style.transform = 'none';
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const dRect = devices.getBoundingClientRect();
  devices.querySelectorAll('.device').forEach(d => {
    const r = d.getBoundingClientRect();
    const x = (r.x - dRect.x) / inv, y = (r.y - dRect.y) / inv;
    const w = r.width / inv, h = r.height / inv;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  });
  const bw = maxX - minX, bh = maxY - minY;
  if (!isFinite(bw) || !isFinite(bh)) { devices.style.transform = `scale(${dScale})`; return; }
  // 包围盒中心相对画布中心的偏移（容器 clientWidth/Height 即画布尺寸）
  const ox = (minX + bw / 2) - devices.clientWidth / 2;
  const oy = (minY + bh / 2) - devices.clientHeight / 2;
  // 缩得太小时（横版窄画布塞竖版模板），保持原样大小、水平+垂直居中，
  // 这样边框/灵动岛/小组件都能清晰看到；多余空间由背景图 cover 铺满
  if (dScale < 0.6) {
    const cw = devices.clientWidth, ch = devices.clientHeight;
    // 不用 transform 缩放：html2canvas 对嵌套 transform（含设备本身的 3D rotate）容易栈溢出。
    // 改用 position:absolute + left/top + margin 负值做位移，让 html2canvas 能正常渲染
    devices.style.position = 'absolute';
    devices.style.left = (cw / 2 - bw / 2 - ox) + 'px';
    devices.style.top = (ch / 2 - bh / 2 - oy) + 'px';
    devices.style.transform = 'none';
    // 若设备超过画布尺寸，用 scale + transformOrigin 缩放（避免和 device 自身 3D rotate 叠加栈溢出）
    if (bw > cw * 0.95 || bh > ch * 0.95) {
      const fit = Math.min(cw * 0.95 / bw, ch * 0.95 / bh, 1);
      devices.style.transform = `scale(${fit})`;
      devices.style.transformOrigin = `${bw / 2}px ${bh / 2}px`;
    }
    return;
  }
  // translate 补偿 + 等比缩放（缩放以画布中心为原点）
  devices.style.transform = `translate(${(-ox * dScale).toFixed(2)}px, ${(-oy * dScale).toFixed(2)}px) scale(${dScale})`;
}

const WALLPAPER_CACHE = {};
function loadWallpaper(url, cb){
  if (WALLPAPER_CACHE[url]) { const img = WALLPAPER_CACHE[url]; if (img.complete) cb(img); return; }
  const img = new Image(); img.crossOrigin = 'anonymous'; img.decoding = 'sync';
  img.onload = () => { WALLPAPER_CACHE[url] = img; cb(img); };
  img.onerror = () => { cb(null); };
  img.src = url;
}
function drawCover(ctx, img, w, h){
  ctx.clearRect(0, 0, w, h);
  const scale = Math.max(w / img.width, h / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  const dx = (w - dw) / 2, dy = (h - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
}
function parsePx(css, prop, fallback){
  const m = (css || '').match(new RegExp(prop + ':\\s*(\\d+)px'));
  return m ? +m[1] : fallback;
}
function parseRadius(css){
  const m = (css || '').match(/border-radius:\s*([^;]+)/);
  return m ? m[1].trim() : null;
}
function mergeCss(el, base, extra){
  el.style.cssText = (base || '') + ';' + (extra || '');
}
function renderDevice(container, dev, idx){
  const st = dev.style;
  const ov = S.deviceOverrides[idx] || {};
  const device = document.createElement('div'); device.className = 'device';
  // device style: 保留其它，替换 transform
  let dCss = st.device || '';
  const tf = dev.style.deviceTransform || {};
  const rot = ov.rotate ?? tf.rotate ?? 0;
  const tx = ov.translateX ?? tf.translateX ?? 0;
  const ty = ov.translateY ?? tf.translateY ?? 0;
  const sx = ov.scaleX ?? ov.scale ?? tf.scaleX ?? tf.scale ?? 1;
  const sy = ov.scaleY ?? ov.scale ?? tf.scaleY ?? tf.scale ?? sx;
  const skx = ov.skewX ?? tf.skewX ?? 0;
  const sky = ov.skewY ?? tf.skewY ?? 0;
  const rx = ov.rotateX ?? tf.rotateX ?? 0;
  const ry = ov.rotateY ?? tf.rotateY ?? 0;
  const rz = ov.rotateZ ?? tf.rotateZ ?? 0;
  // 设备中心对齐画布中心：left:50%;top:50% 把左上角放在中心，先用 translate(-50%,-50%) 把中心移到该点
  const transformStr = `translate(-50%, -50%) rotate(${rot}deg) translateX(${tx}px) translateY(${ty}px) scaleX(${sx}) scaleY(${sy}) perspective(none) skewX(${skx}deg) skewY(${sky}deg) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  dCss = dCss.replace(/transform:\s*[^;]+/, '') + `;transform:${transformStr}`;
  device.style.cssText = dCss;
  container.appendChild(device);

  // screen 居中，并裁剪圆角
  const screen = document.createElement('div'); screen.className = 'screen';
  const radius = parseRadius(st.wallpaper) || parseRadius(st.screen) || '62px';
  // 用 inset:0 + margin:auto 居中，同时兼容 px 与百分比宽高（如屏幕截图圆角 width:100%）
  // 避免 transform:translate(-50%,-50%) 导致 html2canvas 无法正确渲染内部背景图/Canvas
  let screenCss = (st.screen || '') + `;position:absolute;inset:0;margin:auto;overflow:hidden;transform:none;`;
  screenCss += `border-radius:${radius};`;
  screen.style.cssText = screenCss;
  device.appendChild(screen);

  // 仅样机模式
  if (S.phoneSubTab === 'frame') {
    screen.innerHTML = '';
    screen.style.background = 'rgba(0,0,0,0)';
    if (S.showBorder) { const border = document.createElement('div'); border.className='border'; border.style.cssText = st.border || ''; device.appendChild(border); }
    return;
  }

  // 壁纸：每台设备独立（第 idx 台设备取用户上传列表第 idx 张，未上传则使用模板默认）
  // 用 div + background-size:cover 渲染，并避免 screen 使用 transform（html2canvas 对 transform 内背景图/Canvas 渲染异常）
  const wpUrl = S.wallpapers[idx] || dev.sc.wallpaperImage || '';
  if (wpUrl) {
    const wp = document.createElement('div'); wp.className = 'wallpaper';
    mergeCss(wp, `background-image:url("${wpUrl}");background-size:cover;background-position:center;background-repeat:no-repeat;`, st.wallpaper);
    screen.appendChild(wp);
  }

  // 菜单模式
  if (S.phoneSubTab === 'menu') {
    const grid = document.createElement('div'); grid.className = 'icon-grid';
    for (let i = 0; i < 24; i++) {
      const icon = document.createElement('div'); icon.className = 'app-icon';
      const label = ['照片','日历','相机','邮件','地图','时钟','天气','提醒','备忘录','设置','App Store','健康','钱包','家庭','音乐','视频','图书','股市','查找','语音','文件','通讯录','Safari','信息'][i] || 'App';
      icon.innerHTML = `<div class="icon" style="background:${grad(i)}">${label.slice(0,2)}</div><div class="label">${label}</div>`;
      grid.appendChild(icon);
    }
    screen.appendChild(grid);
    const dock = document.createElement('div'); dock.className = 'dock';
    [1,2,3,4].forEach(i => { const ic = document.createElement('div'); ic.className='icon'; ic.textContent = i; dock.appendChild(ic); });
    screen.appendChild(dock);
  }

  // 状态栏（仅菜单模式）
  if (S.phoneSubTab === 'menu' && S.showStatus) {
    const sb = document.createElement('div'); sb.className = 'status-bar';
    mergeCss(sb, 'color:#fff;', st.statusBar);
    sb.innerHTML = `<div class="left">${S.timeText}</div><div class="right">${wifiSvg()}${batterySvg()}</div>`;
    screen.appendChild(sb);
  }

  // 灵动岛：清理模板里的 left/scale/transform/z-index/bottom，强制水平居中，避免 html2canvas 不识别 !important
  // 仅当 cameraType === "no" 时强制不渲染（与原站行为一致），其他情况由 S.showIsland 开关控制
  if (S.showIsland && dev.sc.cameraType !== 'no') {
    const island = document.createElement('div'); island.className = 'dynamic-island';
    const camCss = (st.camera || '').replace(/\b(left|right|transform|scale|z-index|bottom)\s*:\s*[^;]+;?/gi, '');
    mergeCss(island, camCss, 'left:50%;top:12px;transform:translateX(-50%);z-index:30;');
    screen.appendChild(island);
  }

  // 日期时间（锁屏模式）
  if (S.phoneSubTab === 'lock' && S.showDateTime) {
    const dt = document.createElement('div'); dt.className = 'date-time';
    mergeCss(dt, '', st.dateTime);
    const time = document.createElement('div'); time.className = 'time'; time.textContent = S.timeText;
    mergeCss(time, '', st.time);
    const timeStyleCss = ['font-size:68px;font-weight:300;','font-size:68px;font-weight:700;letter-spacing:2px;','font-size:68px;font-family:SFMono-Regular,Menlo,monospace;font-weight:500;','font-size:52px;font-weight:200;'][S.timeStyle] || '';
    mergeCss(time, '', timeStyleCss);
    const date = document.createElement('div'); date.className = 'date'; date.textContent = S.dateText + ' ' + S.weekdayText;
    mergeCss(date, '', st.date);
    dt.appendChild(time); dt.appendChild(date); screen.appendChild(dt);
  }

  // 底部条：清理模板里的 left/scale/transform/z-index/top，强制水平居中
  // 仅当 bottomType === "no" 时强制不渲染（与原站行为一致），其他情况由 S.showBottom 开关控制
  if (S.showBottom && dev.sc.bottomType !== 'no') {
    const bar = document.createElement('div'); bar.className = 'bottom-bar';
    const botCss = (st.bottom || '').replace(/\b(left|right|transform|scale|z-index|top)\s*:\s*[^;]+;?/gi, '');
    mergeCss(bar, botCss, 'left:50%;transform:translateX(-50%);');
    screen.appendChild(bar);
  }

  // border 叠加 - 确保 border 覆盖整个 device 区域，有正确尺寸
  // 仅当 borderType === "no" 时强制不渲染（与原站行为一致），其他情况由 S.showBorder 开关控制
  if (S.showBorder && dev.sc.borderType !== 'no') {
    const border = document.createElement('div'); border.className = 'border';
    const borderCss = (st.border || '') + ';position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;';
    border.style.cssText = borderCss;
    device.appendChild(border);
  }

  // 小组件（专注模式药丸）- 锁屏模式下显示，模拟 iOS 26 Liquid Glass 风格
  // 仅当 componentType === "no" 时强制不渲染（与原站行为一致），其他情况由 S.showWidget 开关控制
  if (S.phoneSubTab === 'lock' && S.showWidget && dev.sc.componentType !== 'no') {
    const widget = document.createElement('div'); widget.className = 'focus-pill-widget';
    widget.innerHTML = `
      <div class="pill">
        <div class="pill-icon"><div class="icon-silence"></div></div>
        <div class="pill-text">专注模式</div>
        <div class="pill-icon"><div class="icon-camera"></div></div>
      </div>
    `;
    screen.appendChild(widget);
  }
}
function grad(i){
  const colors = [['#ff2d55','#ff6b22'],['#5856d6','#af52de'],['#34c759','#30d158'],['#007aff','#5ac8fa'],['#ff9500','#ffcc00'],['#8e8e93','#c7c7cc'],['#ff3b30','#ff9500'],['#5ac8fa','#007aff'],['#af52de','#ff2d55'],['#34c759','#5856d6'],['#ffcc00','#ff9500'],['#007aff','#5856d6']];
  const c = colors[i % colors.length]; return `linear-gradient(135deg,${c[0]},${c[1]})`;
}

// ============== 右侧面板 ==============
function updateRightPanel(){
  const tpl = curTpl();
  const tabs = $('rightTabs'); tabs.innerHTML = '';
  RIGHT_TABS.forEach(t => { const el = document.createElement('div'); el.className = 'tab'+(S.rightTab===t.k?' on':''); el.textContent = t.n; el.onclick = () => { S.rightTab=t.k; updateRightPanel(); }; tabs.appendChild(el); });
  const c = $('tabContent'); c.innerHTML = '';
  if (S.rightTab === 'bg') renderBgPanel(c, tpl);
  else if (S.rightTab === 'phone') renderPhonePanel(c, tpl);
  else if (S.rightTab === 'icon') renderIconPanel(c);
  else if (S.rightTab === 'data') renderDataPanel(c);
  else renderTextPanel(c);
}

function renderBgPanel(c, tpl){
  let h = `<div class="row"><div class="lbl">画布（Beta）</div><div class="inputs"><input type="number" id="inW" value="${S.bgW}"><input type="number" id="inH" value="${S.bgH}"></div></div>`;
  // 尺寸预设
  h += `<div class="size-presets">`;
  SIZE_PRESETS.forEach(p => {
    h += `<div class="preset${S.bgW===p.w && S.bgH===p.h ? ' on':''}" data-w="${p.w}" data-h="${p.h}"><div style="font-weight:600">${p.name}</div><div style="color:#999;font-size:11px">${p.w} x ${p.h} （${p.ratio}）</div></div>`;
  });
  h += `</div>`;
  // 背景类型
  h += `<div class="row"><div class="lbl">背景</div><div class="btns"><span class="btn ${S.bgMode==='tpl'?'on':''}" data-m="tpl">模板背景</span><span class="btn ${S.bgMode==='image'?'on':''}" data-m="image">图片</span><span class="btn ${S.bgMode==='color'?'on':''}" data-m="color">纯色</span><span class="btn ${S.bgMode==='gradient'?'on':''}" data-m="gradient">渐变</span></div></div>`;
  if (S.bgMode === 'image') h += `<div class="row"><div class="upload-box" id="bgUpload">+ 点击上传背景</div></div>`;
  else if (S.bgMode === 'color') h += `<div class="row"><input type="color" id="bgColor" value="${S.bgColor}"></div>`;

// ============== 历史数据：自动保存 / 导入导出（多设备共享） ==============
const STATE_KEY = 'mockup_v3_state';
let _saveTimer = null;
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveState, 600);
}
function saveState(){
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(S));
    return true;
  } catch (e) {
    // 存储配额不足：降级保存（丢弃过大的壁纸图片，保留设置）
    try {
      const keep = Object.assign({}, S);
      keep.wallpapers = (keep.wallpapers || []).map(u => (typeof u === 'string' && u.length > 400000) ? null : u);
      keep.bgImage = null;
      localStorage.setItem(STATE_KEY, JSON.stringify(keep));
      return 'partial';
    } catch (e2) { console.warn('自动保存失败', e2); return false; }
  }
}
function loadSavedState(){
  try { return JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) { return null; }
}
function applySavedState(o){
  if (!o) return false;
  // 模板选择始终以第一个模板（用户常用模板，如公众号封面2）为默认，
  // 不恢复上次的 typeIdx/tplIdx，避免每次打开被旧选择覆盖。
  loadTemplate(0, 0);
  const keep = Object.assign({}, o);
  delete keep.typeIdx; delete keep.tplIdx;
  S = Object.assign(S, keep);
  renderTemplateGrid(); renderCanvas(); updateRightPanel();
  return true;
}
function exportDataFile(){
  saveState();
  const payload = { app:'mockup-v3', ver:1, savedAt:new Date().toISOString(), state:S };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '壁纸样机数据-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  showToast('数据包已导出，可通过隔空投送/微信发送到其他设备');
}
function importDataFile(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || o.app !== 'mockup-v3' || !o.state) throw new Error('不是有效的数据包');
        applySavedState(o.state);
        saveState();
        showToast('数据导入成功');
      } catch (e) { showToast('导入失败：' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function clearSavedState(){
  if (!confirm('确定清空本机保存的全部历史数据（壁纸、设置）吗？')) return;
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem('mockup_v3_tpl');
  loadTemplate(S.typeIdx, S.tplIdx);
  showToast('已清空，重新开始');
}
function renderDataPanel(c){
  const saved = loadSavedState();
  const wpCount = saved && saved.wallpapers ? saved.wallpapers.filter(Boolean).length : 0;
  c.innerHTML = `
    <div class="row"><div class="hint">本机会<b>自动保存</b>你的模板、壁纸与设置，关闭网页后重新打开不会丢失。<br><br>换设备使用时：先在旧设备<b>导出数据包</b>，通过 隔空投送 / 微信 / iCloud 发送到新设备，再点<b>导入数据包</b>即可延续使用。</div></div>

  $('btnExportData').onclick = exportDataFile;

// ============== 图片上传 ==============
function pickImage(cb){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = () => { const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload = () => compressDataURL(r.result).then(cb); r.readAsDataURL(f); };
  inp.click();
}
function pickImages(cb){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange = async () => {
    if (!inp.files.length) return;
    const urls = [];
    for (const f of inp.files) { const r = new FileReader(); const u = await new Promise(res => { r.onload = () => res(r.result); r.readAsDataURL(f); }); urls.push(await compressDataURL(u)); }
    cb(urls);
  };
  inp.click();
}
// 压缩超大图片：长边限 2000px、JPEG 90%，减小存储/数据包体积；若压完反而更大则保留原图
async function compressDataURL(url, maxEdge = 2000, quality = 0.9){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const out = cv.toDataURL('image/jpeg', quality);
        resolve(out.length < url.length ? out : url);
      } catch (e) { resolve(url); }
    };
    img.onerror = () => resolve(url);
    img.src = url;
  });
}

// ============== 导出 ==============
// 导出前预加载所有 CDN 图片为 data URL，避免 iOS Safari 上 html2canvas 跨域图片无限等待
async function preloadCDNImages(rootEl){
  const urlSet = new Set();
  const allEls = [rootEl, ...rootEl.querySelectorAll('*')];
  for (const el of allEls) {
    const bg = el.style.backgroundImage;
    if (bg && bg !== 'none') {
      const m = bg.matchAll(/url\(["']?([^"')]+)["']?\)/g);
      for (const mm of m) { if (mm[1].startsWith('http') && !mm[1].startsWith('data:')) urlSet.add(mm[1]); }
    }
    if (el.tagName === 'IMG' && el.src && el.src.startsWith('http') && !el.src.startsWith('data:')) urlSet.add(el.src);
  }
  if (urlSet.size === 0) return null;
  // fetch 下载 + FileReader 转 data URL（比 Image.crossOrigin 更可靠）
  const urlMap = {};
  await Promise.all([...urlSet].map(async url => {
    try {
      const res = await fetch(url, { mode: 'cors' });
      const blob = await res.blob();
      urlMap[url] = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    } catch(e) { console.warn('预加载失败:', url, e.message); }
  }));
  // 替换 DOM 中的 URL
  const replacements = [];
  for (const el of allEls) {
    const bg = el.style.backgroundImage;
    if (bg && bg !== 'none') {
      let newBg = bg;
      for (const [url, dataURL] of Object.entries(urlMap)) { newBg = newBg.split(url).join(dataURL); }
      if (newBg !== bg) { replacements.push({ el, prop: 'bg', val: bg }); el.style.backgroundImage = newBg; }
    }
    if (el.tagName === 'IMG' && urlMap[el.src]) { replacements.push({ el, prop: 'src', val: el.src }); el.src = urlMap[el.src]; }
  }
  return replacements;
}
function restoreImages(replacements){ if(!replacements) return; for(const r of replacements){ if(r.prop==='bg') r.el.style.backgroundImage=r.val; else if(r.prop==='src') r.el.src=r.val; } }

// 核心渲染：把当前画布渲染成 PNG blob（不弹 UI），供单张导出与批量导出共用
async function renderToBlob(scale = 2){
  const canvas = $('canvas');
  // 移出可视区并移除缩放，确保导出原始尺寸（不用 opacity:0，会导致 html2canvas 渲染空白）
  const saved = { transform: canvas.style.transform, position: canvas.style.position, left: canvas.style.left, top: canvas.style.top, zIndex: canvas.style.zIndex };
  canvas.style.transform = 'none';
  canvas.style.position = 'fixed';
  canvas.style.left = '-9999px';
  canvas.style.top = '0';
  canvas.style.zIndex = '-1';
  let replacements = null;
  try {
    if (typeof html2canvas === 'undefined') throw new Error('图片库未加载，请刷新页面重试');
    // 预加载 CDN 图片 → data URL，消除跨域问题
    replacements = await preloadCDNImages(canvas);
    // 超时保护：30 秒未完成则报错，避免永久卡住
    const renderP = html2canvas(canvas, { scale, useCORS: false, allowTaint: false, backgroundColor: null, logging: false });
    const timeoutP = new Promise((_, reject) => setTimeout(() => reject(new Error('生成超时，请减少设备数量或降低分辨率后重试')), 30000));
    const c = await Promise.race([renderP, timeoutP]);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    if (!blob) throw new Error('生成图片失败');
    return blob;
  } finally {
    restoreImages(replacements);
    Object.assign(canvas.style, saved);
    fitCanvas();
  }
}

async function exportPNG(scale = 2){
  showToast('正在加载素材…', 0);
  try {
    showToast('正在生成图片…', 0);
    const blob = await renderToBlob(scale);
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (('ontouchstart' in window) && window.innerWidth < 1024);
    const isSA = (navigator.standalone === true) || window.matchMedia('(display-mode: standalone)').matches;
    hideToast();
    const blobURL = URL.createObjectURL(blob);
    if (isMobile || isSA) {
      showSaveOverlay(blobURL, blob);
    } else {
      const a = document.createElement('a'); a.href = blobURL; a.download = 'mockup-' + Date.now() + '.png'; a.click();
      setTimeout(() => URL.revokeObjectURL(blobURL), 8000);
    }
  } catch(e){ console.error(e); showToast('导出失败：'+e.message, 4000); }
}

// 批量导出：一次选 N 张壁纸，按当前模板的设备台数自动分组，
// 每组壁纸填满各台手机屏幕，自动导出多张样机图。所有结果一次性展示在结果面板，
// 每张可单独保存/下载，也可全部下载；支持重新选择壁纸。导出后壁纸保留在界面。
async function batchExportWallpapers(){
  const devCount = curTpl().devices.length;
  showToast('请选择多张壁纸（手机上长按相册缩略图可多选）', 3500);
  pickImages(async urls => {
    if (!urls.length) return;
    // 本次选中的壁纸，导出后作为当前壁纸保留在界面上
    let finalWalls = [];
    const blobs = [];   // 收集所有导出的图片 blob
    const labels = [];  // 每张图的提示文字
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (('ontouchstart' in window) && window.innerWidth < 1024);
    try {
      if (devCount === 1) {
        // 单设备模板：N 张壁纸逐张导出 N 张图
        const n = urls.length;
        for (let i = 0; i < n; i++) {
          showToast(`正在导出第 ${i+1}/${n} 张…`, 0);
          S.wallpapers = [urls[i]];
          renderCanvas();
          await new Promise(r => setTimeout(r, 150)); // 等待壁纸渲染稳定
          blobs.push(await renderToBlob(2));
          labels.push(`第 ${i+1} 张`);
        }
        finalWalls.push(urls[urls.length - 1]); // 保留最后一张作为当前壁纸
      } else if (urls.length === 1) {
        // 多设备模板只选了1张：所有手机都用这张，导出1张图
        showToast('正在导出…', 0);
        S.wallpapers = Array(devCount).fill(urls[0]);
        renderCanvas();
        await new Promise(r => setTimeout(r, 150));
        blobs.push(await renderToBlob(2));
        labels.push(`全部 ${devCount} 台`);
        finalWalls = Array(devCount).fill(urls[0]);
      } else {
        // 多设备模板选了多张：每 devCount 张一组，组内每台手机分配一张，导出一张图
        const groups = [];
        for (let i = 0; i < urls.length; i += devCount) {
          groups.push(urls.slice(i, i + devCount));
        }
        const n = groups.length;
        for (let g = 0; g < n; g++) {
          showToast(`正在导出第 ${g+1}/${n} 张…`, 0);
          // 该组壁纸：填满各台设备（不足的用模板默认壁纸占位，防止个别手机空白）
          const group = groups[g];
          S.wallpapers = [];
          for (let d = 0; d < devCount; d++) {
            S.wallpapers.push(group[d] || curTpl().devices[d].sc.wallpaperImage || '');
          }
          renderCanvas();
          await new Promise(r => setTimeout(r, 150));
          blobs.push(await renderToBlob(2));
          labels.push(`第 ${g+1}/${n} 张`);
          // 最后一组作为当前界面的壁纸
          if (g === n - 1) { finalWalls = S.wallpapers.slice(); }
        }
      }
    } catch(e){
      console.error(e);
      showToast('导出出错：' + e.message, 4000);
      return;
    }
    // 导出结束后，把最后导出的这组壁纸保留为当前壁纸，方便直接看到效果
    S.wallpapers = finalWalls.slice();
    renderCanvas(); updateRightPanel();
    hideToast();
    // 一次性把所有结果展示在画布画廊中（可左右滑动查看、逐张保存、重新选择）
    showBatchResults(blobs, labels);
  });
}

// ===================== 画布结果画廊 =====================
// 批量导出完成后，所有结果图直接显示在画布上（覆盖原编辑画布），
// 支持左右滑动/箭头/底部缩略图切换查看下一张；每张可单独保存到相册；可重新选择壁纸。
let GALLERY = { items: [], idx: 0, active: false, touchX: 0, touchY: 0, swipeT: 0 };

function galleryEl(id){ return document.getElementById(id); }

// 显示画廊并切换到第 idx 张
function showBatchResults(blobs, labels, isMobile){
  // 释放旧画廊资源
  galleryExit(true);
  // 初始化数据
  GALLERY.items = blobs.map((b, i) => ({ url: URL.createObjectURL(b), blob: b, label: (labels && labels[i]) || ('第 ' + (i+1) + ' 张') }));
  GALLERY.idx = 0;
  GALLERY.active = true;
  // 构建底部缩略图条
  const strip = galleryEl('galleryStrip');
  strip.innerHTML = '';
  GALLERY.items.forEach((o, i) => {
    const t = document.createElement('div');
    t.className = 'gs-thumb';
    t.innerHTML = `<img src="${o.url}"><span class="gs-idx">${i+1}</span>`;
    t.onclick = () => galleryShow(i);
    strip.appendChild(t);
  });
  // 显示界面
  galleryEl('galleryView').classList.add('show');
  galleryEl('galleryBar').classList.add('show');
  strip.classList.add('show');
  galleryShow(0);
  showToast(`已生成 ${GALLERY.items.length} 张，左右滑动查看`, 2500);
}

// 切换到第 idx 张
function galleryShow(idx){
  if (!GALLERY.active || idx < 0 || idx >= GALLERY.items.length) return;
  GALLERY.idx = idx;
  const o = GALLERY.items[idx];
  const img = galleryEl('galleryImg');
  img.src = o.url;
  galleryEl('gbCount').textContent = (idx + 1) + ' / ' + GALLERY.items.length;
  galleryEl('gbPrev').disabled = (idx === 0);
  galleryEl('gbNext').disabled = (idx === GALLERY.items.length - 1);
  // 缩略图高亮 + 滚动到可见
  const strip = galleryEl('galleryStrip');
  [...strip.children].forEach((t, i) => t.classList.toggle('on', i === idx));
  const cur = strip.children[idx];
  if (cur) cur.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
}

// 保存当前张：优先系统分享（真正存相册），不支持则弹大浮层（长按保存）
async function gallerySave(){
  const o = GALLERY.items[GALLERY.idx];
  if (!o) return;
  const btn = galleryEl('gbSave');
  const canShare = !!(navigator.canShare);
  if (canShare && o.blob) {
    const file = new File([o.blob], 'mockup-' + Date.now() + '.png', { type: 'image/png' });
    if (navigator.canShare({ files: [file] })) {
      btn.textContent = '正在打开…'; btn.disabled = true;
      try { await navigator.share({ files: [file], title: '壁纸样机', text: '第 ' + (GALLERY.idx + 1) + ' 张' }); }
      catch(e) { if (e.name !== 'AbortError') { console.error(e); showToast('分享未完成，可长按图片保存', 2500); } }
      btn.textContent = '保存到相册'; btn.disabled = false;
      return;
    }
  }
  // 不支持系统分享 → 弹大浮层，长按图片保存
  showSaveOverlay(o.url, o.blob, '第 ' + (GALLERY.idx + 1) + ' 张');
}

// 退出画廊：释放所有 blobURL，恢复编辑画布
function galleryExit(silent){
  const v = galleryEl('galleryView'), bar = galleryEl('galleryBar'), strip = galleryEl('galleryStrip');
  v.classList.remove('show'); bar.classList.remove('show'); strip.classList.remove('show');
  galleryEl('galleryImg').removeAttribute('src');
  strip.innerHTML = '';
  if (GALLERY.items) GALLERY.items.forEach(o => { try { URL.revokeObjectURL(o.url); } catch(e){} });
  GALLERY.items = []; GALLERY.idx = 0; GALLERY.active = false;
  if (!silent) renderCanvas(); // 回到编辑态画布
}

// 重新选择壁纸：退出画廊后重新走批量选择流程
function galleryReselect(){
  galleryExit(true);
  setTimeout(() => batchExportWallpapers(), 60);
}

// 绑定画廊交互（箭头、缩略图切换、保存、重新选择、退出、触摸滑动）
function setupGallery(){
  galleryEl('gbPrev').onclick = () => galleryShow(GALLERY.idx - 1);
  galleryEl('gbNext').onclick = () => galleryShow(GALLERY.idx + 1);
  galleryEl('gbSave').onclick = gallerySave;
  galleryEl('gbReselect').onclick = galleryReselect;
  galleryEl('gbExit').onclick = () => galleryExit(false);
  // 触摸左右滑动切换
  const v = galleryEl('galleryView');
  v.addEventListener('touchstart', e => {
    GALLERY.touchX = e.touches[0].clientX; GALLERY.touchY = e.touches[0].clientY; GALLERY.swipeT = Date.now();
  }, { passive: true });
  v.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - GALLERY.touchX;
    const dy = e.changedTouches[0].clientY - GALLERY.touchY;
    const dt = Date.now() - GALLERY.swipeT;
    // 快速水平滑动（大于40px，水平为主，时长<500ms）
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && dt < 500) {
      if (dx < 0) galleryShow(GALLERY.idx + 1);   // 左滑 → 下一张
      else galleryShow(GALLERY.idx - 1);          // 右滑 → 上一张
    }
  }, { passive: true });
  // 桌面端也支持左右方向键
  document.addEventListener('keydown', e => {
    if (!GALLERY.active) return;
    if (e.key === 'ArrowRight') { galleryShow(GALLERY.idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { galleryShow(GALLERY.idx - 1); e.preventDefault(); }
    else if (e.key === 'Escape') { galleryExit(false); }
  });
}

// 导出图片预览浮层：大图 + 足够大的保存按钮（长按图片存储 / 系统分享）
function showSaveOverlay(imgURL, blob, cap){
  let ov = document.getElementById('saveOverlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'saveOverlay'; document.body.appendChild(ov); }
  const tip = cap ? ('当前为第 ' + cap + '，请保存后再切换下一张') : '';
  let html = '<img src="' + imgURL + '">';
  html += '<div class="tip">' + tip + '<br>方法一：长按上方图片 → 选「存储图像」<br>方法二：点下方按钮保存</div>';
  if (blob && navigator.canShare) {
    html += '<button class="share-btn">保存到相册</button>';
  }
  html += '<button class="close">关闭</button>';
  ov.innerHTML = html;
  ov.style.zIndex = '9999';
  ov.querySelector('.close').onclick = () => { ov.remove(); URL.revokeObjectURL(imgURL); };
  if (blob && navigator.canShare) {
    const btn = ov.querySelector('.share-btn');
    btn.onclick = async () => {
      btn.textContent = '正在打开…'; btn.disabled = true;
      try {
        const file = new File([blob], 'mockup-' + Date.now() + '.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '壁纸样机' });
        }
      } catch(e) {
        if (e.name !== 'AbortError') { console.error(e); showToast('分享失败，请长按图片保存', 3000); }
      }
      btn.textContent = '保存到相册'; btn.disabled = false;
    };
  }
}

// ============== 移动端侧拉抽屉 ==============
// 手机端：左侧模板列表从左侧滑出；电脑端（>860px）不生效，保持三栏布局
const MOBILE_BREAK = 860;
function isMobileLayout(){ return window.innerWidth <= MOBILE_BREAK; }
function openDrawer(){
  const p = $('leftPanel'); if (!p) return;
  p.classList.add('open'); $('drawerMask').classList.add('show');
  document.body.classList.add('drawer-open');
}
function closeDrawer(){
  const p = $('leftPanel'); if (!p || !p.classList.contains('open')) return;
  p.classList.remove('open'); $('drawerMask').classList.remove('show');
  document.body.classList.remove('drawer-open');
}
function setupDrawer(){
  const menu = $('menuBtn'), closeBtn = $('closeDrawer'), mask = $('drawerMask');
  if (menu) menu.onclick = () => $('leftPanel').classList.contains('open') ? closeDrawer() : openDrawer();
  if (closeBtn) closeBtn.onclick = closeDrawer;
  if (mask) mask.onclick = closeDrawer;
  // 切回桌面尺寸时自动收起抽屉并复位布局
  window.addEventListener('resize', () => { if (window.innerWidth > MOBILE_BREAK) closeDrawer(); });
}

// ============== 初始化 ==============
function init(){
  setupDrawer();
  renderTemplateGrid();
  loadTemplate(0,0);
  // 恢复本机自动保存的历史数据（模板、壁纸、设置）
  const saved = loadSavedState();
  if (saved) applySavedState(saved);
  else {
    const old = localStorage.getItem('mockup_v3_tpl');
    if (old) { try { const o = JSON.parse(old); loadTemplate(o.type||0, o.tpl||0); } catch(e){} }
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });
  setupGallery(); // 绑定画布结果画廊交互
  $('btnExport').onclick = () => exportPNG(2);
  $('btnBatch').onclick = async () => {
    // 真正的批量导出：一次选多张壁纸，按模板设备台数分组，自动导出多张样机图
    await batchExportWallpapers();
  };
  $('btnSave').onclick = () => { const r = saveState(); showToast(r === false ? '保存失败：本机存储空间不足' : '已保存到本机，下次打开自动恢复'); };
}
init();
</script>
